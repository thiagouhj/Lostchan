<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha — Lostchan</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #FFFFEE;
            color: #800000;
            font: 10pt Arial, Helvetica, sans-serif;
            text-align: center;
        }

        main {
            width: min(100%, 480px);
            margin: 0 auto;
        }

        h1 {
            margin: 10px 0;
            font: bold 28pt "Times New Roman", Times, serif;
        }

        p {
            color: #444;
        }

        .game-box {
            margin: 20px auto;
            padding: 12px;
            background: #F0E0D6;
            border: 1px solid #D9BFB7;
        }

        .score {
            margin: 4px 0 10px;
            font-weight: bold;
            font-size: 12pt;
        }

        canvas {
            display: block;
            width: min(100%, 400px);
            height: auto;
            margin: 0 auto;
            background: #FFFFEE;
            border: 1px solid #800000;
            image-rendering: pixelated;
        }

        .game-actions,
        .direction-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        button,
        .back-link {
            padding: 6px 12px;
            color: #800000;
            background: #ECE9D8;
            border: 1px solid #7F9DB9;
            font: inherit;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-top: 8px;
        }

        .direction-controls {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(2, 38px);
            gap: 5px;
        }

        .direction-controls button {
            padding: 2px;
            font-size: 16pt;
        }

        #upButton { grid-column: 2; }
        #leftButton { grid-column: 1; grid-row: 2; }
        #downButton { grid-column: 2; grid-row: 2; }
        #rightButton { grid-column: 3; grid-row: 2; }

        @media (min-width: 700px) {
            .direction-controls {
                display: none;
            }
        }

        body[data-theme="dark"] {
            background: #1b1b1b;
            color: #ddd;
        }

        body[data-theme="dark"] p {
            color: #ccc;
        }

        body[data-theme="dark"] .game-box {
            background: #292421;
            border-color: #594d47;
        }

        body[data-theme="dark"] canvas {
            background: #222;
            border-color: #777;
        }

        body[data-theme="dark"] button,
        body[data-theme="dark"] .back-link {
            background: #343434;
            color: #eee;
            border-color: #777;
        }
    </style>
</head>
<body>
    <main>
        <h1>Jogo da Cobrinha</h1>
        <p>Apanha as maçãs para ganhares pontos. Usa as setas ou WASD para jogar.</p>
        <section class="game-box" aria-label="Jogo da cobrinha">
            <div class="score" id="score" aria-live="polite">Pontos: 0</div>
            <canvas id="game" width="400" height="400" aria-label="Tabuleiro do jogo da cobrinha"></canvas>
            <p id="gameStatus" role="status">Carrega em Começar para jogar.</p>
            <div class="game-actions">
                <button id="startButton" type="button">Começar</button>
            </div>
            <div class="direction-controls" aria-label="Controlos direcionais">
                <button id="upButton" type="button" aria-label="Cima">↑</button>
                <button id="leftButton" type="button" aria-label="Esquerda">←</button>
                <button id="downButton" type="button" aria-label="Baixo">↓</button>
                <button id="rightButton" type="button" aria-label="Direita">→</button>
            </div>
        </section>
        <a class="back-link" href="jogos.html">Voltar aos Jogos</a>
    </main>
    <script>
        const canvas = document.getElementById('game');
        const context = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const statusElement = document.getElementById('gameStatus');
        const startButton = document.getElementById('startButton');
        const cellSize = 20;
        const cellCount = canvas.width / cellSize;
        let snake;
        let apple;
        let direction;
        let nextDirection;
        let score;
        let timer;
        let running = false;

        if (localStorage.getItem('lostchan-theme') === 'dark') {
            document.body.dataset.theme = 'dark';
        }

        function drawBoard() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            if (!snake) return;

            context.fillStyle = '#117743';
            snake.forEach((segment, index) => {
                context.fillRect(
                    segment.x * cellSize + 1,
                    segment.y * cellSize + 1,
                    cellSize - 2,
                    cellSize - 2
                );
                if (index === 0) {
                    context.fillStyle = '#0b5730';
                }
            });

            context.font = `${cellSize - 2}px serif`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(
                '🍎',
                apple.x * cellSize + cellSize / 2,
                apple.y * cellSize + cellSize / 2
            );
        }

        function placeApple() {
            const emptyCells = [];
            for (let y = 0; y < cellCount; y += 1) {
                for (let x = 0; x < cellCount; x += 1) {
                    if (!snake.some(segment => segment.x === x && segment.y === y)) {
                        emptyCells.push({ x, y });
                    }
                }
            }
            if (emptyCells.length === 0) {
                finishGame('Ganhaste! Preencheste o tabuleiro.');
                return;
            }
            apple = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        function startGame() {
            window.clearInterval(timer);
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = direction;
            score = 0;
            running = true;
            scoreElement.textContent = 'Pontos: 0';
            statusElement.textContent = 'Boa sorte!';
            startButton.textContent = 'Recomeçar';
            placeApple();
            drawBoard();
            timer = window.setInterval(moveSnake, 120);
        }

        function finishGame(message) {
            running = false;
            window.clearInterval(timer);
            statusElement.textContent = `${message} Pontuação: ${score}.`;
            startButton.textContent = 'Jogar novamente';
        }

        function moveSnake() {
            direction = nextDirection;
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            const ateApple = head.x === apple.x && head.y === apple.y;
            const body = ateApple ? snake : snake.slice(0, -1);
            if (
                head.x < 0 || head.x >= cellCount ||
                head.y < 0 || head.y >= cellCount ||
                body.some(segment => segment.x === head.x && segment.y === head.y)
            ) {
                finishGame('Fim do jogo!');
                return;
            }

            snake.unshift(head);
            if (ateApple) {
                score += 1;
                scoreElement.textContent = `Pontos: ${score}`;
                placeApple();
            } else {
                snake.pop();
            }
            drawBoard();
        }

        function changeDirection(x, y) {
            if (!running || (x === -direction.x && y === -direction.y)) return;
            nextDirection = { x, y };
        }

        document.addEventListener('keydown', event => {
            const controls = {
                ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
                ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
                ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
                ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
            };
            const move = controls[event.key];
            if (move) {
                event.preventDefault();
                changeDirection(move[0], move[1]);
            }
        });

        [
            ['upButton', 0, -1],
            ['downButton', 0, 1],
            ['leftButton', -1, 0],
            ['rightButton', 1, 0]
        ].forEach(([id, x, y]) => {
            document.getElementById(id).addEventListener('click', () => changeDirection(x, y));
        });
        startButton.addEventListener('click', startGame);
        drawBoard();
    </script>
</body>
</html>
